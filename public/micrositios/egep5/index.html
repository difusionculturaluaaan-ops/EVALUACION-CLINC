<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EGEP-5 - Evaluación Global de Estrés Postraumático</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <!-- Estilos base compartidos -->
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/typography.css">
  <link rel="stylesheet" href="/css/components.css">

  <style>
    :root {
      --accent-light: #06b6d4;
      --text-primary: #e6eaf0;
      --text-secondary: #8b949e;
      --border: #30363d;
      --bg-surface-2: #161b22;
    }

    .egep5-instruction {
      background: #cffafe;
      border-left: 4px solid #06b6d4;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .egep5-instruction p {
      color: #164e63;
      margin: 0;
      font-size: 14px;
      line-height: 1.5;
      font-weight: 600;
    }

    .egep5-items-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
      background: var(--bg-surface-2);
    }

    .egep5-items-table th {
      background: var(--bg-surface-2);
      color: var(--text-primary);
      font-weight: 600;
    }

    .egep5-items-table td {
      border: 1px solid var(--border);
      padding: 12px;
      vertical-align: middle;
    }

    .egep5-items-table input[type="radio"] {
      cursor: pointer;
      accent-color: #06b6d4;
    }

    .button-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
      font-size: 14px;
    }

    .btn-primary {
      background: #06b6d4;
      color: white;
    }

    .btn-primary:hover {
      background: #0891b2;
    }

    .btn-secondary {
      background: #4b5563;
      color: white;
    }

    .btn-secondary:hover {
      background: #5a6578;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .egep5-tab-content {
      display: none;
      padding: 20px;
      max-height: calc(100vh - 250px);
      overflow-y: auto;
    }

    .egep5-tab-content.active {
      display: block;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }

    .egep5-tabs {
      display: flex;
      gap: 2px;
      padding: 12px 0 0;
      border-bottom: 1px solid var(--border);
      background: #0d1117;
      flex-wrap: wrap;
    }

    .egep5-tab {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      color: #8b949e;
      padding: 8px 18px 12px;
      position: relative;
      border-radius: 6px 6px 0 0;
      transition: color 0.2s;
    }

    .egep5-tab:hover {
      color: var(--text-primary);
    }

    .egep5-tab.active {
      color: #06b6d4;
      background: rgba(6, 182, 212, 0.06);
    }

    .egep5-tab.active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      right: 0;
      height: 2px;
      background: #06b6d4;
      border-radius: 2px 2px 0 0;
    }

    /* MOBILE RESPONSIVE */
    @media (max-width: 768px) {
      .egep5-items-table {
        font-size: 12px;
      }

      .egep5-items-table td {
        padding: 8px 4px;
      }

      .button-group {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }

      .egep5-tabs {
        flex-wrap: wrap;
      }

      .egep5-tab {
        font-size: 12px;
        padding: 6px 12px 10px;
      }

      main {
        padding: 12px !important;
      }

      .egep5-tab-content {
        padding: 12px 0 !important;
      }
    }

    @media (max-width: 480px) {
      .button-group {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }

      .egep5-tab {
        font-size: 11px;
      }

      main {
        padding: 8px;
      }
    }

    @media print {
      header, .egep5-tabs, .button-group, .btn, #egep5-file-input {
        display: none !important;
      }
      main {
        max-width: 100% !important;
        padding: 0 !important;
        height: auto !important;
      }
      .egep5-tab-content {
        display: block !important;
        padding: 0 !important;
        height: auto !important;
        max-height: none !important;
      }
      .egep5-items-table {
        page-break-inside: avoid;
      }
    }
  </style>
</head>
<body data-theme="light">

<header style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); padding: 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px;">
  <div style="display: flex; align-items: center; gap: 16px;">
    <button onclick="window.location.href='../../index.html'" style="background: none; border: none; cursor: pointer; font-size: 18px; color: #60a5fa;">← Volver</button>
    <div>
      <h1 style="margin: 0; font-size: 24px; font-weight: 700; color: #06b6d4;">EGEP-5</h1>
      <p style="margin: 4px 0 0 0; font-size: 12px; color: #8b949e;">Evaluación Global de Estrés Postraumático</p>
    </div>
  </div>
  <button onclick="document.documentElement.setAttribute('data-theme', document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark')" style="background: none; border: none; cursor: pointer; font-size: 20px;">🌙</button>
</header>

<main style="max-width: 1200px; margin: 0 auto; padding: 20px;">

  <!-- TABS NAVIGATION -->
  <div class="egep5-tabs">
    <button class="egep5-tab active" data-tab="datos" onclick="window.tests_egep5.irTab('datos')">
      <span class="tab-num">1</span> Ingreso de Datos
    </button>
    <button class="egep5-tab" data-tab="test" onclick="window.tests_egep5.irTab('test')">
      <span class="tab-num">2</span> Aplicar Test
    </button>
    <button class="egep5-tab" data-tab="resultados" onclick="window.tests_egep5.irTab('resultados')">
      <span class="tab-num">3</span> Resultados
    </button>
    <button class="egep5-tab" data-tab="perfil" onclick="window.tests_egep5.irTab('perfil')">
      <span class="tab-num">4</span> Perfil Visual
    </button>
    <button class="egep5-tab" data-tab="interpretacion" onclick="window.tests_egep5.irTab('interpretacion')">
      <span class="tab-num">5</span> Interpretación
    </button>
  </div>

  <!-- TAB 1: DATOS -->
  <div class="egep5-tab-content active" id="tab-datos">
    <div style="background: var(--bg-surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 20px;">
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px;">
        <div>
          <label style="font-weight: 600; display: block; margin-bottom: 8px; color: var(--text-primary); font-size: 13px;">Nombre del Paciente</label>
          <input type="text" id="e_nombre" placeholder="Nombre completo" style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; background: #0d1117; color: var(--text-primary); font-size: 14px;">
        </div>
        <div>
          <label style="font-weight: 600; display: block; margin-bottom: 8px; color: var(--text-primary); font-size: 13px;">Edad</label>
          <input type="number" id="e_edad" placeholder="Edad" style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; background: #0d1117; color: var(--text-primary); font-size: 14px;">
        </div>
        <div>
          <label style="font-weight: 600; display: block; margin-bottom: 8px; color: var(--text-primary); font-size: 13px;">Sexo</label>
          <select id="e_sexo" style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; background: #0d1117; color: var(--text-primary); font-size: 14px;">
            <option>Seleccionar...</option>
            <option>Masculino</option>
            <option>Femenino</option>
            <option>Otro</option>
          </select>
        </div>
        <div>
          <label style="font-weight: 600; display: block; margin-bottom: 8px; color: var(--text-primary); font-size: 13px;">Fecha de Evaluación</label>
          <input type="date" id="e_fecha" style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; background: #0d1117; color: var(--text-primary); font-size: 14px;">
        </div>
        <div style="grid-column: 1 / -1;">
          <label style="font-weight: 600; display: block; margin-bottom: 8px; color: var(--text-primary); font-size: 13px;">Evaluador (Psicólogo)</label>
          <input type="text" id="e_evaluador" placeholder="Nombre del evaluador" style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; background: #0d1117; color: var(--text-primary); font-size: 14px;">
        </div>
      </div>

      <div class="button-group">
        <button onclick="window.tests_egep5.irTab('test')" class="btn btn-primary">→ Aplicar Test</button>
        <button onclick="window.tests_egep5.irTab('resultados'); window.tests_egep5.calcularResultados();" class="btn" style="background: #4b5563; color: white;">⊡ Calcular Resultados</button>
      </div>

      <div class="button-group secondary">
        <button onclick="document.getElementById('egep5-file-input').click()" class="btn btn-secondary">↑ Importar JSON</button>
        <button onclick="window.tests_egep5.limpiar()" class="btn" style="background: #ef4444; color: white;">✕ Limpiar</button>
      </div>
    </div>
  </div>

  <!-- TAB 2: TEST -->
  <div class="egep5-tab-content" id="tab-test">
    <div id="egep5-test-container" style="background: var(--bg-surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 20px;"></div>
  </div>

  <!-- TAB 3: RESULTADOS -->
  <div class="egep5-tab-content" id="tab-resultados">
    <div id="egep5-diagnostico" style="background: var(--bg-surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px;"></div>
    <div id="egep5-criteria-table" style="background: var(--bg-surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px;"></div>
    <div id="egep5-symptoms-summary" style="background: var(--bg-surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px;"></div>
    <div id="egep5-functioning-summary" style="background: var(--bg-surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px;"></div>
    <div id="egep5-specifications" style="background: var(--bg-surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px;"></div>
    <div id="egep5-baremos" style="background: var(--bg-surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px;"></div>

    <!-- Botones de acción -->
    <div class="button-group" style="margin-top: 20px;">
      <button onclick="window.tests_egep5.generarPDF()" class="btn btn-primary">📄 Generar PDF</button>
      <button class="btn btn-primary" id="btn-egep5-guardar" onclick="window.tests_egep5.guardarEnExpediente()" style="background:#27ae60">💾 Guardar en Expediente</button>
      <button onclick="window.tests_egep5.exportarJSON()" class="btn btn-secondary">↓ Exportar JSON</button>
    </div>
  </div>

  <!-- TAB 4: PERFIL VISUAL -->
  <div class="egep5-tab-content" id="tab-perfil">
    <div id="egep5-perfil-container" style="background: var(--bg-surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 20px;"></div>
  </div>

  <!-- TAB 5: INTERPRETACIÓN -->
  <div class="egep5-tab-content" id="tab-interpretacion">
    <div id="egep5-interpretacion-container" style="background: var(--bg-surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 20px;"></div>
  </div>

</main>

<!-- Input file hidden para importar JSON -->
<input type="file" id="egep5-file-input" accept=".json,application/json" style="display: none;" onchange="window.tests_egep5.inicializarImportador()">

<!-- Scripts -->
<script src="/js/api.js"></script>
<script src="/micrositios/egep5/js/egep5.js"></script>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    window.tests_egep5.init();
  });
</script>

</body>
</html>
